name: Keep Supabase awake

# Free Supabase projects pause after a week without activity. Run one real
# query against each project daily. Customer traffic also counts as activity;
# this is the backup for quiet weeks.
on:
  schedule:
    - cron: "17 3 * * *" # 08:47 IST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      LIVE_DATABASE_URL: ${{ secrets.LIVE_DATABASE_URL }}
      STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
      SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
    steps:
      - name: Query live database
        if: ${{ env.LIVE_DATABASE_URL != '' }}
        run: psql "$LIVE_DATABASE_URL" -tAc "select 1"
      - name: Query staging database
        if: ${{ env.STAGING_DATABASE_URL != '' }}
        run: psql "$STAGING_DATABASE_URL" -tAc "select 1"
      - name: Check live site is up
        if: ${{ env.SITE_URL != '' }}
        run: curl -fsS --max-time 20 -o /dev/null "$SITE_URL/"
